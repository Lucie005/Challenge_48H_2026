<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Y - Messagerie</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <header class="mobile-header">
        <div class="logo-y-mini">Y</div>
        <span class="mobile-header-title">Paris Ynov Campus</span>
    </header>

    <div class="app-container">
        
        <aside class="sidebar">
            <a href="{{ url_for('home') }}" class="logo-btn">Y</a>
            <nav class="nav-menu">
                <a href="{{ url_for('home') }}" class="nav-icon" title="Accueil"><i class="fas fa-home"></i></a>
                <a href="{{ url_for('messages') }}" class="nav-icon active" title="Messages"><i class="far fa-comment-dots"></i></a>
                <a href="{{ url_for('students_directory') }}" class="nav-icon" title="Étudiants"><i class="fas fa-user-friends"></i></a>
                <a href="{{ url_for('jobs') }}" class="nav-icon" title="Jobs"><i class="fas fa-briefcase"></i></a>
            </nav>
            <div class="spacer"></div>
            <a href="{{ url_for('register') }}" class="nav-icon btn-add" title="Ajouter un compte"><i class="fas fa-plus"></i></a>
            
            <a href="{{ url_for('profile') }}" title="Mon profil">
                <img src="https://ui-avatars.com/api/?name={{ session['username'] | replace(' ', '+') if session['username'] else 'User' }}&background=7C3AED&color=fff&size=40" alt="Mon profil" class="profile-mini">
            </a>
            <a href="{{ url_for('logout') }}" class="nav-icon nav-icon-danger logout-pc" title="Déconnexion"><i class="fas fa-sign-out-alt"></i></a>
        </aside>

        <main class="main-content">
            <div class="content-wrapper messages-wrapper">
                
                <div class="conversations-list">
                    <div class="conversations-header">
                        <h2>Messages</h2>
                        <div class="search-chat">
                            <i class="fas fa-search text-muted"></i>
                            <input type="text" placeholder="Rechercher...">
                        </div>
                    </div>

                    <div class="contacts-scroll" id="contacts-list">
                        {% for contact in contacts %}
                        <div class="contact-item {{ 'active' if active_id == contact.id else '' }}" 
                             data-id="{{ contact.id }}"
                             data-username="{{ contact.username }}"
                             onclick="loadConversation(this.dataset.id, this.dataset.username)">
                            <div class="contact-avatar-box">
                                <img src="https://ui-avatars.com/api/?name={{ contact.username | replace(' ', '+') }}&background=7C3AED&color=fff&size=50" alt="Avatar" class="contact-avatar">
                            </div>
                            <div class="contact-info">
                                <div class="contact-top">
                                    <span class="contact-name">{{ contact.username }}</span>
                                </div>
                                <span class="contact-preview text-muted">{{ contact.filiere or contact.user_type }}</span>
                            </div>
                        </div>
                        {% else %}
                        <p class="text-muted" style="padding: 20px; text-align: center;">Aucun contact. Allez dans l'annuaire pour discuter !</p>
                        {% endfor %}
                    </div>
                </div>

                <div class="chat-area" id="chat-window">
                    <div class="empty-chat-state">
                        <div class="empty-chat-icon">
                            <i class="far fa-paper-plane"></i>
                        </div>
                        <h3>Sélectionnez une conversation</h3>
                        <p>Échangez en temps réel avec la communauté Ynov</p>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script>
        let currentPartnerId = null;

        async function loadConversation(userId, username) {
            currentPartnerId = userId;
            const chatWindow = document.getElementById('chat-window');
            
            // Mettre à jour l'UI vers l'état de chargement
            chatWindow.innerHTML = `
                <div class="conversations-header"><h3>Chat avec ${username}</h3></div>
                <div class="chat-history" id="msg-container" style="flex:1; padding:20px; overflow-y:auto; display:flex; flex-direction:column; gap:10px;">
                    <p class="text-muted">Chargement des messages...</p>
                </div>
                <div class="chat-input-area" style="padding:15px; background:white; border-top:1px solid var(--border-color); display:flex; gap:10px;">
                    <input type="text" id="new-msg-input" placeholder="Votre message..." style="flex:1; border:none; outline:none;" onkeypress="if(event.key==='Enter') sendMessage()">
                    <button class="send-btn" onclick="sendMessage()"><i class="far fa-paper-plane"></i></button>
                </div>
            `;

            try {
                const response = await fetch(`/api/messages/${userId}`);
                const messages = await response.json();
                renderMessages(messages);
            } catch (e) {
                console.error(e);
            }
        }

        function renderMessages(messages) {
            const container = document.getElementById('msg-container');
            container.innerHTML = messages.length ? '' : '<p class="text-muted">Aucun message. Dites bonjour !</p>';
            messages.forEach(m => {
                const msgDiv = document.createElement('div');
                msgDiv.className = m.is_mine ? 'chat-msg msg-user' : 'chat-msg msg-bot';
                msgDiv.innerHTML = `<div>${m.body}</div><small style="font-size:0.7rem; opacity:0.7;">${m.sent_at}</small>`;
                container.appendChild(msgDiv);
            });
            container.scrollTop = container.scrollHeight;
        }

        async function sendMessage() {
            const input = document.getElementById('new-msg-input');
            const body = input.value.trim();
            if (!body || !currentPartnerId) return;

            try {
                const response = await fetch('/api/messages/send', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        receiver_id: currentPartnerId,
                        body: body
                    })
                });
                const data = await response.json();
                if (data.success) {
                    input.value = '';
                    // Recharger la conversation pour voir le nouveau message
                    const contacts = document.querySelectorAll('.contact-item');
                    const activeContact = Array.from(contacts).find(c => c.classList.contains('active'));
                    loadConversation(currentPartnerId, activeContact ? activeContact.querySelector('.contact-name').innerText : "Contact");
                }
            } catch (e) { console.error("Erreur d'envoi:", e); }
        }

        // Charger automatiquement si un ID est passé en URL
        window.onload = () => {
            const urlParams = new URLSearchParams(window.location.search);
            const uid = urlParams.get('user_id');
            if (uid) {
                const firstContact = document.querySelector('.contact-item.active');
                if (firstContact) firstContact.click();
            }
        };
    </script>
</body>
</html>
